name: Android CI

on:
  push:
    branches: ["compose-rewrite"]
    paths-ignore:
      - ".github/**"
      - "!.github/workflows/**"
      - ".idea/"
      - "fastlane/"
      - ".gitignore"
      - "*.md"
      - "LICENSE"

  workflow_dispatch:

jobs:
  build:
    name: Build App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Set release type
        run: echo "releaseType=CI" > package.properties

      - name: Create temporary signing key
        run: |
          mkdir -p "$HOME/.gradle"

          keytool -genkeypair \
            -keystore "$HOME/key.jks" \
            -storepass android \
            -keypass android \
            -alias custom \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Custom Build, OU=Dev, O=Custom, L=Unknown, ST=Unknown, C=US"

          cat > "$HOME/.gradle/gradle.properties" <<EOF
          AKANE_RELEASE_STORE_FILE=$HOME/key.jks
          AKANE_RELEASE_STORE_PASSWORD=android
          AKANE_RELEASE_KEY_ALIAS=custom
          AKANE_RELEASE_KEY_PASSWORD=android
          EOF

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Find APK
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "No APK found"
            exit 1
          fi

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"
          echo "APK_FILE_NAME=$(basename "$APK_FILE" .apk)" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_FILE_NAME }}
          path: ${{ env.APK_FILE }}
          compression-level: 9
